name: STEP 10 Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/step10-cloud-cutover

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version

      - name: Resolve Cargo target directory
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          "TM_CARGO_TARGET_DIR=$($metadata.target_directory)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Rust build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/build/cargo
            app/dist/build/cargo
          key: ${{ runner.os }}-rust-1.97-${{ hashFiles('app/Cargo.lock') }}

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Verify frontend
        shell: pwsh
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit code $LASTEXITCODE" }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }

      - name: Build Windows executables
        shell: pwsh
        run: |
          & '.\node_modules\.bin\tauri.cmd' build --target x86_64-pc-windows-msvc --no-bundle --features custom-protocol -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri release build failed with exit code $LASTEXITCODE" }
          cargo build --locked --release --target x86_64-pc-windows-msvc -p tm-cli --bin tm-cli
          if ($LASTEXITCODE -ne 0) { throw "tm-cli release build failed with exit code $LASTEXITCODE" }

      - name: Prepare verified artifact
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'tm-step10-windows-x64'
          $desktop = Get-ChildItem -LiteralPath $env:TM_CARGO_TARGET_DIR -Filter 'tm.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]release[\\/]tm\.exe$' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          $cli = Get-ChildItem -LiteralPath $env:TM_CARGO_TARGET_DIR -Filter 'tm-cli.exe' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]release[\\/]tm-cli\.exe$' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $desktop -or -not $cli) {
            throw 'Expected release executables were not found under the Cargo target directory.'
          }
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item -LiteralPath $desktop.FullName -Destination (Join-Path $artifact 'tm.exe')
          Copy-Item -LiteralPath $cli.FullName -Destination (Join-Path $artifact 'tm-cli.exe')
          Get-FileHash -Algorithm SHA256 (Join-Path $artifact 'tm.exe'), (Join-Path $artifact 'tm-cli.exe') |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -Encoding ascii (Join-Path $artifact 'SHA256SUMS.txt')

      - name: Upload Windows executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tm-step10-windows-x64
          path: ${{ runner.temp }}\tm-step10-windows-x64
          if-no-files-found: error
          retention-days: 1
