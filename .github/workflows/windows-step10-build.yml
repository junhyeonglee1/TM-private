name: STEP 10 Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/step10-cloud-cutover

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --target x86_64-pc-windows-msvc --component rustfmt,clippy
          rustup default 1.97.0
          rustc --version
          cargo --version

      - name: Resolve Cargo target directory
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          "TM_CARGO_TARGET_DIR=$($metadata.target_directory)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Rust build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            dist/build/cargo
            app/dist/build/cargo
          key: ${{ runner.os }}-rust-1.97-${{ hashFiles('app/Cargo.lock') }}

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Build and pin expense workbook decryptor
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --require-hashes --requirement sidecars/requirements-expense-sidecar-lock.txt
          if ($LASTEXITCODE -ne 0) { throw "Expense sidecar dependency installation failed with exit code $LASTEXITCODE" }
          python -m unittest discover -s sidecars -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw "Expense sidecar tests failed with exit code $LASTEXITCODE" }
          $sidecarRoot = Join-Path $env:RUNNER_TEMP 'tm-expense-sidecar-build'
          $dist = Join-Path $sidecarRoot 'dist'
          $work = Join-Path $sidecarRoot 'work'
          $spec = Join-Path $sidecarRoot 'spec'
          New-Item -ItemType Directory -Force -Path $dist, $work, $spec | Out-Null
          python -m PyInstaller --clean --noconfirm --onefile --name tm-office-decryptor --distpath $dist --workpath $work --specpath $spec sidecars/tm_office_decryptor.py
          if ($LASTEXITCODE -ne 0) { throw "Expense sidecar build failed with exit code $LASTEXITCODE" }
          $sidecar = Join-Path $dist 'tm-office-decryptor.exe'
          if (-not (Test-Path -LiteralPath $sidecar -PathType Leaf)) { throw 'Expense sidecar executable was not created.' }
          $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $sidecar
          $startInfo.UseShellExecute = $false
          $startInfo.CreateNoWindow = $true
          $startInfo.RedirectStandardInput = $true
          $startInfo.RedirectStandardOutput = $true
          $startInfo.RedirectStandardError = $true
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo = $startInfo
          if (-not $process.Start()) { throw 'Expense sidecar executable smoke test could not start.' }
          $process.StandardInput.BaseStream.Write([byte[]](0, 0, 0, 0), 0, 4)
          $process.StandardInput.Close()
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 1 -or $stdout -notmatch '"code":"invalid_password"' -or
              -not [string]::IsNullOrEmpty($stderr)) {
            throw 'Expense sidecar executable smoke test failed.'
          }
          $process.Dispose()
          $hash = (Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash.ToLowerInvariant()
          "TM_EXPENSE_DECRYPTOR_PATH=$sidecar" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TM_EXPENSE_DECRYPTOR_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify frontend
        shell: pwsh
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Verify production expense deployment guards
        shell: pwsh
        run: |
          .\scripts\configure-expense-railway.ps1 -RunGuardSelfTest
          .\scripts\deploy-verified-expense-railway.ps1 `
            -ExpectedHeadSha '0000000000000000000000000000000000000000' `
            -Step10RunId 1 `
            -Step16RunId 1 `
            -RunGuardSelfTest

      - name: Parse reviewed PowerShell operations scripts
        shell: pwsh
        run: |
          $paths = @(
            '.\scripts\build-release.ps1',
            '.\scripts\expense-release-evidence.ps1',
            '.\scripts\configure-expense-railway.ps1',
            '.\scripts\deploy-verified-expense-railway.ps1',
            '.\scripts\verify-expense-production.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) { throw "PowerShell parser rejected $path" }
          }

      - name: Verify Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed with exit code $LASTEXITCODE" }
          cargo test --locked --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed with exit code $LASTEXITCODE" }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed with exit code $LASTEXITCODE" }

      - name: Build Windows executables
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:TM_CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release'
          $desktopPath = Join-Path $releaseDir 'tm.exe'
          $cliPath = Join-Path $releaseDir 'tm-cli.exe'
          Remove-Item -LiteralPath $desktopPath, $cliPath -Force -ErrorAction SilentlyContinue
          & '.\node_modules\.bin\tauri.cmd' build --target x86_64-pc-windows-msvc --no-bundle --features custom-protocol -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri release build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $desktopPath -PathType Leaf)) {
            throw 'The exact target desktop executable was not created by this run.'
          }
          cargo build --locked --release --target x86_64-pc-windows-msvc -p tm-cli --bin tm-cli
          if ($LASTEXITCODE -ne 0) { throw "tm-cli release build failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $cliPath -PathType Leaf)) {
            throw 'The exact target CLI executable was not created by this run.'
          }
          "TM_DESKTOP_EXE_PATH=$desktopPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TM_DESKTOP_EXE_SHA256=$((Get-FileHash -LiteralPath $desktopPath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TM_CLI_EXE_PATH=$cliPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TM_CLI_EXE_SHA256=$((Get-FileHash -LiteralPath $cliPath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare verified artifact
        shell: pwsh
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP 'tm-step10-windows-x64'
          $expectedReleaseDir = [System.IO.Path]::GetFullPath(
            (Join-Path $env:TM_CARGO_TARGET_DIR 'x86_64-pc-windows-msvc\release')
          )
          if (-not [string]::Equals(
              [System.IO.Path]::GetFullPath((Split-Path -Parent $env:TM_DESKTOP_EXE_PATH)),
              $expectedReleaseDir,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -or -not [string]::Equals(
              [System.IO.Path]::GetFullPath((Split-Path -Parent $env:TM_CLI_EXE_PATH)),
              $expectedReleaseDir,
              [System.StringComparison]::OrdinalIgnoreCase
            ) -or -not (Test-Path -LiteralPath $env:TM_DESKTOP_EXE_PATH -PathType Leaf) -or
            -not (Test-Path -LiteralPath $env:TM_CLI_EXE_PATH -PathType Leaf)) {
            throw 'The exact target release executables are missing or outside the approved directory.'
          }
          if ((Get-FileHash -LiteralPath $env:TM_DESKTOP_EXE_PATH -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              $env:TM_DESKTOP_EXE_SHA256 -or
            (Get-FileHash -LiteralPath $env:TM_CLI_EXE_PATH -Algorithm SHA256).Hash.ToLowerInvariant() -ne
              $env:TM_CLI_EXE_SHA256) {
            throw 'A release executable changed after its exact build hash was recorded.'
          }
          New-Item -ItemType Directory -Force -Path $artifact | Out-Null
          Copy-Item -LiteralPath $env:TM_DESKTOP_EXE_PATH -Destination (Join-Path $artifact 'tm.exe')
          Copy-Item -LiteralPath $env:TM_CLI_EXE_PATH -Destination (Join-Path $artifact 'tm-cli.exe')
          if (-not (Test-Path -LiteralPath $env:TM_EXPENSE_DECRYPTOR_PATH -PathType Leaf)) {
            throw 'The verified expense sidecar was not found.'
          }
          $sidecarHash = (Get-FileHash -LiteralPath $env:TM_EXPENSE_DECRYPTOR_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sidecarHash -ne $env:TM_EXPENSE_DECRYPTOR_SHA256) {
            throw 'The expense sidecar changed after its build hash was embedded.'
          }
          Copy-Item -LiteralPath $env:TM_EXPENSE_DECRYPTOR_PATH -Destination (Join-Path $artifact 'tm-office-decryptor.exe')
          Get-FileHash -Algorithm SHA256 (Join-Path $artifact 'tm.exe'), (Join-Path $artifact 'tm-cli.exe'), (Join-Path $artifact 'tm-office-decryptor.exe') |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path -Leaf $_.Path) } |
            Set-Content -Encoding ascii (Join-Path $artifact 'SHA256SUMS.txt')

      - name: Upload Windows executables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tm-step10-windows-x64
          path: ${{ runner.temp }}\tm-step10-windows-x64
          if-no-files-found: error
          retention-days: 1
